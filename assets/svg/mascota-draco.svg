<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-label="Draco, un dragón verde y amistoso que sostiene un libro">
  <defs>
    <linearGradient id="draco-cuerpo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd6b4"/>
      <stop offset=".55" stop-color="#2fb49a"/>
      <stop offset="1" stop-color="#16847a"/>
    </linearGradient>
    <linearGradient id="draco-vientre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#ffd89b"/>
    </linearGradient>
    <linearGradient id="draco-ala" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ee7d0"/>
      <stop offset="1" stop-color="#3bb6a4"/>
    </linearGradient>
    <linearGradient id="draco-libro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#4330b8"/>
    </linearGradient>
    <radialGradient id="draco-luz" cx=".5" cy=".45" r=".55">
      <stop offset="0" stop-color="#fff7d6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff7d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="draco-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#101033" flood-opacity=".24"/>
    </filter>
    <style>
      .flotar { animation: flotar 5.5s ease-in-out infinite; transform-origin: 250px 250px; }
      .parpadear { animation: parpadear 6s ease-in-out infinite; transform-origin: 232px 208px; }
      .parpadear2 { animation: parpadear 6s ease-in-out infinite; transform-origin: 292px 208px; }
      .ala { animation: aletear 4.2s ease-in-out infinite; transform-origin: 175px 250px; }
      .ala2 { animation: aletear2 4.6s ease-in-out infinite; transform-origin: 330px 250px; }
      .cola { animation: movercola 5s ease-in-out infinite; transform-origin: 225px 360px; }
      .estrella { animation: titilar 3.4s ease-in-out infinite; transform-origin: center; }
      .estrella2 { animation: titilar 4s ease-in-out .8s infinite; transform-origin: center; }
      @keyframes flotar { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
      @keyframes parpadear { 0%,44%,50%,100%{transform:scaleY(1)} 47%{transform:scaleY(.08)} }
      @keyframes aletear { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-7deg)} }
      @keyframes aletear2 { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(7deg)} }
      @keyframes movercola { 0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(4deg)} }
      @keyframes titilar { 0%,100%{opacity:.35;transform:scale(.8)} 50%{opacity:1;transform:scale(1.15)} }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <circle cx="250" cy="245" r="205" fill="url(#draco-luz)"/>
  <g class="flotar" filter="url(#draco-sombra)">
    <!-- estrellas -->
    <g fill="#ffd166">
      <path class="estrella" d="m102 112 4.8 9.9 10.9 1.5-7.9 7.6 1.9 10.8-9.7-5.1-9.7 5.1 1.9-10.8-7.9-7.6 10.9-1.5 4.8-9.9Z"/>
      <path class="estrella2" d="m399 148 3.7 7.6 8.4 1.2-6.1 5.9 1.5 8.3-7.5-3.9-7.5 3.9 1.5-8.3-6.1-5.9 8.4-1.2 3.7-7.6Z" fill="#ff8fab"/>
      <circle class="estrella" cx="404" cy="330" r="5" fill="#8ee7d0"/>
      <circle class="estrella2" cx="91" cy="315" r="4" fill="#ffd166"/>
    </g>

    <!-- cola -->
    <g class="cola">
      <path d="M221 348c-37 30-82 30-96 3-11-21 9-44 31-35 15 6 10 25-4 22" fill="none" stroke="#16847a" stroke-width="26" stroke-linecap="round"/>
      <path d="M221 348c-37 30-82 30-96 3-11-21 9-44 31-35 15 6 10 25-4 22" fill="none" stroke="#2fb49a" stroke-width="17" stroke-linecap="round"/>
      <path d="m128 323 22 14-24 11 2-25Z" fill="#ffd166"/>
    </g>

    <!-- alas -->
    <g class="ala">
      <path d="M202 261C146 212 107 218 85 251c30-9 50-3 69 12-23 1-38 12-47 30 24-13 42-11 58 1-14 8-20 21-20 38 19-29 43-37 65-30Z" fill="url(#draco-ala)" stroke="#16847a" stroke-width="5" stroke-linejoin="round"/>
      <path d="M146 273c20 3 42 17 57 34M132 303c18-2 39 4 55 14" fill="none" stroke="#16847a" stroke-width="3" opacity=".55"/>
    </g>
    <g class="ala2">
      <path d="M303 261c56-49 95-43 117-10-30-9-50-3-69 12 23 1 38 12 47 30-24-13-42-11-58 1 14 8 20 21 20 38-19-29-43-37-65-30Z" fill="url(#draco-ala)" stroke="#16847a" stroke-width="5" stroke-linejoin="round"/>
      <path d="M359 273c-20 3-42 17-57 34M373 303c-18-2-39 4-55 14" fill="none" stroke="#16847a" stroke-width="3" opacity=".55"/>
    </g>

    <!-- cuerpo -->
    <path d="M250 152c62 0 95 39 95 91 0 35-11 66-31 88-18 20-40 31-64 31s-46-11-64-31c-20-22-31-53-31-88 0-52 33-91 95-91Z" fill="url(#draco-cuerpo)"/>
    <path d="M250 208c35 0 55 23 55 64 0 29-8 53-24 69-9 9-20 13-31 13s-22-4-31-13c-16-16-24-40-24-69 0-41 20-64 55-64Z" fill="url(#draco-vientre)" opacity=".95"/>

    <!-- patas -->
    <path d="M193 357c-3 20-14 35-32 43-8 4-9 14 0 17 22 8 47-2 60-24" fill="#2fb49a" stroke="#16847a" stroke-width="5" stroke-linecap="round"/>
    <path d="M307 357c3 20 14 35 32 43 8 4 9 14 0 17-22 8-47-2-60-24" fill="#2fb49a" stroke="#16847a" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="169" cy="417" rx="21" ry="10" fill="#16847a"/>
    <ellipse cx="331" cy="417" rx="21" ry="10" fill="#16847a"/>

    <!-- cuernos -->
    <path d="M208 154c-8-27 2-47 22-62-2 22 3 38 16 51" fill="#ffd166" stroke="#e0a93b" stroke-width="5" stroke-linejoin="round"/>
    <path d="M292 154c8-27-2-47-22-62 2 22-3 38-16 51" fill="#ffd166" stroke="#e0a93b" stroke-width="5" stroke-linejoin="round"/>

    <!-- cabeza -->
    <path d="M250 115c47 0 76 28 76 70 0 43-31 77-76 77s-76-34-76-77c0-42 29-70 76-70Z" fill="url(#draco-cuerpo)"/>
    <path d="M250 240c-21 0-38-11-48-28 13 8 29 12 48 12s35-4 48-12c-10 17-27 28-48 28Z" fill="#bff4e5" opacity=".65"/>

    <!-- ojos -->
    <g>
      <ellipse cx="221" cy="190" rx="29" ry="32" fill="#fffdf5"/>
      <ellipse cx="279" cy="190" rx="29" ry="32" fill="#fffdf5"/>
      <g class="parpadear">
        <circle cx="228" cy="196" r="15" fill="#18214a"/>
        <circle cx="223" cy="189" r="5.5" fill="#fff"/>
        <circle cx="233" cy="202" r="2.6" fill="#fff"/>
      </g>
      <g class="parpadear2">
        <circle cx="286" cy="196" r="15" fill="#18214a"/>
        <circle cx="281" cy="189" r="5.5" fill="#fff"/>
        <circle cx="291" cy="202" r="2.6" fill="#fff"/>
      </g>
      <path d="M203 181c8-7 19-9 28-6M271 175c9-3 20-1 28 6" fill="none" stroke="#16847a" stroke-width="4" stroke-linecap="round" opacity=".7"/>
    </g>

    <!-- mejillas y sonrisa -->
    <ellipse cx="197" cy="225" rx="14" ry="8" fill="#ff9fb4" opacity=".65"/>
    <ellipse cx="303" cy="225" rx="14" ry="8" fill="#ff9fb4" opacity=".65"/>
    <path d="M235 227c9 8 21 8 30 0" fill="none" stroke="#145c55" stroke-width="5" stroke-linecap="round"/>
    <path d="M244 232c4 5 8 5 12 0" fill="#ff8fab"/>

    <!-- espinas -->
    <path d="m203 134 12-24 12 20M273 130l12-20 12 24" fill="#8ee7d0" stroke="#16847a" stroke-width="3" stroke-linejoin="round"/>

    <!-- libro -->
    <g transform="translate(0 8)">
      <path d="M174 292c23-10 49-8 76 8 27-16 53-18 76-8v70c-23-9-49-7-76 9-27-16-53-18-76-9v-70Z" fill="url(#draco-libro)" stroke="#2d1d85" stroke-width="5" stroke-linejoin="round"/>
      <path d="M250 300v70" stroke="#c9bfff" stroke-width="4" stroke-linecap="round" opacity=".8"/>
      <path d="M192 307c15-4 32 0 48 8M192 323c15-4 32 0 48 8M192 339c15-4 32 0 48 8" fill="none" stroke="#d9d2ff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
      <path d="M308 307c-15-4-32 0-48 8M308 323c-15-4-32 0-48 8M308 339c-15-4-32 0-48 8" fill="none" stroke="#d9d2ff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
      <path d="m250 282 4.3 8.8 9.7 1.4-7 6.8 1.7 9.6-8.7-4.6-8.7 4.6 1.7-9.6-7-6.8 9.7-1.4 4.3-8.8Z" fill="#ffd166"/>
    </g>

    <!-- manos -->
    <ellipse cx="178" cy="348" rx="18" ry="13" fill="#2fb49a" stroke="#16847a" stroke-width="4" transform="rotate(-18 178 348)"/>
    <ellipse cx="322" cy="348" rx="18" ry="13" fill="#2fb49a" stroke="#16847a" stroke-width="4" transform="rotate(18 322 348)"/>
  </g>
</svg>
