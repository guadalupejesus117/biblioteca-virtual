      <rect x="82" y="460" width="24" height="88" rx="4" fill="#ffd166"/>
      <rect x="110" y="430" width="34" height="118" rx="4" fill="#f28482"/>
      <rect x="148" y="452" width="26" height="96" rx="4" fill="#84a59d"/>
      <rect x="178" y="438" width="30" height="110" rx="4" fill="#9b8cf0"/>
      <rect x="212" y="468" width="22" height="80" rx="4" fill="#f6bd60"/>
      <rect x="238" y="426" width="34" height="122" rx="4" fill="#90be6d"/>
      <rect x="276" y="450" width="26" height="98" rx="4" fill="#f7aef8"/>
      <rect x="306" y="440" width="30" height="108" rx="4" fill="#8ecae6"/>
      <!-- globo terráqueo -->
      <g transform="translate(360 470)">
        <circle cx="20" cy="22" r="26" fill="#6ec6c2"/>
        <path d="M6 16c12-8 20 4 28-2M10 34c10-6 18 2 24-4M20 -2v48" stroke="#2b7a78" stroke-width="3" fill="none" opacity=".7"/>
