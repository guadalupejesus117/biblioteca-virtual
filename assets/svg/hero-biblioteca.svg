      <rect x="248" y="276" width="26" height="112" rx="4" fill="#e9c46a"/>
      <rect x="278" y="296" width="30" height="92" rx="4" fill="#ef7fa4"/>
      <rect x="312" y="252" width="34" height="136" rx="4" fill="#7fb7f2"/>
