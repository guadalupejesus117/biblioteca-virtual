        <rect x="0" y="0" width="74" height="20" rx="8" fill="#d4a373"/>
        <rect x="60" y="-4" width="18" height="28" rx="6" fill="#8a5a3b"/>
        <path d="M28 20v30M42 20v30" stroke="#8a5a3b" stroke-width="4"/>
