      <rect x="1434" y="296" width="30" height="92" rx="4" fill="#6ec6c2"/>
      <rect x="1468" y="280" width="24" height="108" rx="4" fill="#f6bd60"/>
      <rect x="1500" y="306" width="34" height="82" rx="4" fill="#c7a4ff"/>
      <!-- telescopio -->
