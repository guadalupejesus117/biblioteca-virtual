    <path d="M930 320c18-22 50-24 70-4 14-12 38-6 44 12 18 2 26 16 16 28H920c-12-10-6-26 10-36Z" fill="#c6b8ee" opacity=".12"/>
    <!-- castillo -->
    <g fill="#17122e" opacity=".9">
      <path d="M650 744V586h28v-46h22v46h22v-70h24v70h24v-46h22v46h28v158Z"/>
      <path d="M812 744V556h26v-64h24v64h24v-44h22v44h28v188Z"/>
      <path d="M880 744V610h24v-50h20v50h24v134Z"/>
      <path d="m656 540 9-34 9 34Zm74-30 8-30 8 30Zm94-26 10-36 10 36Zm56 44 8-28 8 28Z"/>
    </g>
    <g fill="#ffd37a" opacity=".8">
      <rect x="684" y="626" width="8" height="12" rx="2"/>
      <rect x="712" y="664" width="8" height="12" rx="2"/>
      <rect x="836" y="600" width="8" height="12" rx="2"/>
      <rect x="862" y="646" width="8" height="12" rx="2"/>
      <rect x="896" y="668" width="8" height="12" rx="2"/>
    </g>
    <!-- colinas -->
    <path d="M548 744c70-70 132-58 196-16 44-50 108-58 164-8 38-24 78-28 124 0v24H548Z" fill="#231b45"/>
    <!-- marco interior -->
    <path d="M548 744V304c0-133 108-226 252-226s252 93 252 226v440" fill="none" stroke="#8a6488" stroke-width="8" opacity=".55"/>
    <path d="M800 78v666" stroke="#8a6488" stroke-width="4" opacity=".35"/>
    <path d="M548 390h504M548 560h504" stroke="#8a6488" stroke-width="3" opacity=".22"/>
  </g>

