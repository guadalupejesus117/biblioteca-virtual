  </g>

  <!-- Alfombra y piso -->
  <ellipse cx="800" cy="892" rx="430" ry="92" fill="url(#alfombra)" opacity=".85"/>
  <ellipse cx="800" cy="892" rx="340" ry="66" fill="none" stroke="#ffd166" stroke-width="4" opacity=".5" stroke-dasharray="14 12"/>
  <path d="M0 820h1600v180H0Z" fill="#1a1226" opacity=".55"/>

  <!-- Pila de libros centro-izquierda -->
  <g transform="translate(530 790)">
    <rect x="0" y="76" width="150" height="18" rx="8" fill="#6d4a6b"/>
    <rect x="14" y="58" width="136" height="18" rx="8" fill="#f28482"/>
    <rect x="4" y="40" width="132" height="18" rx="8" fill="#ffd166"/>
    <rect x="20" y="22" width="124" height="18" rx="8" fill="#6ec6c2"/>
    <rect x="30" y="4" width="108" height="18" rx="8" fill="#9b8cf0"/>
