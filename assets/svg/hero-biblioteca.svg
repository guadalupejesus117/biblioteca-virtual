<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="titulo-hero">
  <title id="titulo-hero">Biblioteca mágica nocturna con estanterías, libros flotantes, un castillo y una luna</title>
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141033"/>
      <stop offset=".55" stop-color="#2b1f58"/>
      <stop offset="1" stop-color="#4a3277"/>
    </linearGradient>
    <linearGradient id="ventana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a45"/>
      <stop offset=".55" stop-color="#2b3a7a"/>
      <stop offset="1" stop-color="#8a5c9e"/>
    </linearGradient>
    <linearGradient id="madera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4a32"/>
      <stop offset="1" stop-color="#4a2a22"/>
    </linearGradient>
    <linearGradient id="madera-clara" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a76a45"/>
      <stop offset="1" stop-color="#6b3d2c"/>
    </linearGradient>
    <linearGradient id="luna" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8d6"/>
      <stop offset="1" stop-color="#ffd37a"/>
    </linearGradient>
    <linearGradient id="alfombra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4b6c2"/>
      <stop offset=".5" stop-color="#c96a8a"/>
      <stop offset="1" stop-color="#7c3f63"/>
    </linearGradient>
    <radialGradient id="brillo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#b99cff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#b99cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx=".5" cy=".45" r=".62">
      <stop offset=".55" stop-color="#0b0820" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0820" stop-opacity=".72"/>
    </radialGradient>
    <filter id="suave" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="suave2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .flota { animation: flota 7s ease-in-out infinite; }
      .flota-2 { animation: flota 9s ease-in-out infinite reverse; }
      .flota-3 { animation: flota 11s ease-in-out infinite; }
      .titila { animation: titila 3.6s ease-in-out infinite; }
      .titila-2 { animation: titila 5.2s ease-in-out infinite .8s; }
      .titila-3 { animation: titila 4.4s ease-in-out infinite 1.6s; }
      .alas { transform-origin: 1110px 330px; animation: alas 5s ease-in-out infinite; }
      @keyframes flota { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
      @keyframes titila { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes alas { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }
      @media (prefers-reduced-motion: reduce) { .flota,.flota-2,.flota-3,.titila,.titila-2,.titila-3,.alas { animation: none; } }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="1600" height="1000" fill="url(#cielo)"/>
  <ellipse cx="800" cy="470" rx="620" ry="470" fill="url(#brillo)"/>

  <!-- Ventanal central -->
  <g>
    <path d="M520 760V300c0-155 125-260 280-260s280 105 280 260v460Z" fill="#1a1538" stroke="#6d4a6b" stroke-width="26"/>
    <path d="M548 744V304c0-133 108-226 252-226s252 93 252 226v440Z" fill="url(#ventana)"/>
    <!-- luna -->
    <circle cx="930" cy="196" r="62" fill="url(#luna)" opacity=".95"/>
    <circle cx="908" cy="178" r="11" fill="#e8c26b" opacity=".35"/>
    <circle cx="948" cy="218" r="7" fill="#e8c26b" opacity=".3"/>
    <!-- estrellas -->
    <g fill="#fff4c9">
      <circle class="titila" cx="636" cy="150" r="3.2"/>
      <circle class="titila-2" cx="700" cy="96" r="2.2"/>
      <circle class="titila-3" cx="786" cy="152" r="2.6"/>
      <circle class="titila" cx="845" cy="98" r="2"/>
      <circle class="titila-2" cx="1000" cy="126" r="3"/>
      <circle class="titila-3" cx="1016" cy="236" r="2"/>
      <circle class="titila" cx="610" cy="238" r="2.4"/>
      <circle class="titila-2" cx="738" cy="214" r="1.8"/>
